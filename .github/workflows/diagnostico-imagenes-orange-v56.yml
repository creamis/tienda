name: Diagnostico catalogo imagenes Orange V5.6
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: python -m pip install requests beautifulsoup4
      - name: Extraer URLs externas
        run: python herramientas_orange/extraer_catalogo_orange.py
      - name: Subir informes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-imagenes-orange-v56
          path: salida_catalogo_orange/
          if-no-files-found: warn
          retention-days: 7
